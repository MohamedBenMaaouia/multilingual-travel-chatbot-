[pytest]
# Run from the repo root:
#   pytest                 every test except the slow ones (unit + model + scenario tests)
#   pytest -m slow         only the slow end-to-end tests (real Mistral answers, several minutes)
#   pytest tests/test_rules.py -v      one file, one line per test
testpaths = tests
pythonpath = .
addopts = -m "not slow"
markers =
    slow: real Mistral answers end to end (minutes); run with  pytest -m slow
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
